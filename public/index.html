<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycorld - Post Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyworld-bg">
        <div class="cyworld-container">
            <!-- 도트 배경 패턴 라인 -->
            <div class="dot-line-outer">
                <div class="content-wrapper">
                    
                    <!-- 왼쪽 컬럼 (프로필) -->
                    <aside class="left-column">
                        <div class="profile-box">
                            <div class="today-count">TODAY <span class="red">28</span> | TOTAL 12345</div>
                            <div class="profile-img-area">
                                <div class="profile-placeholder">
                                    (◕‿◕✿)
                                </div>
                            </div>
                            <div class="profile-text">
                                마음만은..<br>
                                파워블로거..★<br>
                                <br>
                                <span class="emotion">Today is.. 평온</span>
                            </div>
                            <div class="history-dropdown">
                                <select>
                                    <option>파도타기...</option>
                                </select>
                            </div>
                        </div>
                    </aside>

                    <!-- 메인 콘텐츠 (오른쪽) -->
                    <main class="main-content">
                        <div class="main-header">
                            <h1 class="page-title">게시판</h1>
                            <div class="bgm-player">Running... ♬</div>
                        </div>
                        
                        <div class="scroll-area">
                            <div class="inner-content">
                                
                                <!-- 1. 로그인 섹션 -->
                                <div id="login-section" class="login-box">
                                    <h3>관리자 로그인</h3>
                                    <form id="login-form" class="cy-form">
                                        <input type="text" id="userid" placeholder="ID (admin)" required>
                                        <input type="password" id="userpw" placeholder="PW (1234)" required>
                                        <button type="submit" class="cy-btn-primary">로그인</button>
                                    </form>
                                </div>

                                <!-- 2. 글쓰기 섹션 (로그인 성공 시 보임) -->
                                <div id="write-section" class="hidden">
                                    <div class="write-header">
                                        <h3>새 게시글 작성</h3>
                                        <button id="logout-btn" class="cy-btn-small">로그아웃</button>
                                    </div>
                                    
                                    <div class="input-group">
                                        <label>작성자</label>
                                        <input type="text" id="author" class="cy-input" placeholder="닉네임">
                                    </div>

                                    <div class="input-group">
                                        <label>사진 URL</label>
                                        <input type="text" id="image-url" class="cy-input" placeholder="https://example.com/image.jpg">
                                    </div>

                                    <div class="input-group">
                                        <label>내용</label>
                                        <textarea id="post-text" class="cy-textarea" placeholder="내용을 입력하세요..."></textarea>
                                    </div>

                                    <div class="btn-group">
                                        <button id="preview-btn" class="cy-btn-secondary">미리보기</button>
                                        <button id="generate-btn" class="cy-btn-primary">등록</button>
                                    </div>
                                    
                                    <!-- 미리보기 영역 -->
                                    <div id="preview-area" class="hidden" style="margin-top: 15px; text-align: center;">
                                        <div class="date-header" style="text-align:left;">Preview</div>
                                        <img id="preview-img" src="" style="max-width: 100%; border:1px solid #ccc;" onerror="this.src='https://via.placeholder.com/400x200?text=Image+Load+Error'">
                                    </div>
                                </div>

                                <hr class="cy-divider">

                                <!-- 게시글 목록 (피드) -->
                                <div id="feed-area" class="feed-list">
                                    <div class="loading-msg">Firebase 연결 중...</div>
                                </div>
                            </div>
                        </div>
                    </main>
                    
                    <!-- 우측 탭 (장식용) -->
                    <div class="side-tabs">
                        <div class="side-tab active">홈</div>
                        <div class="side-tab">프로필</div>
                        <div class="side-tab">다이어리</div>
                        <div class="side-tab">사진첩</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- type="module"로 설정하여 import 구문 사용 가능하게 함 -->
    <script type="module" src="script.js"></script>
</body>
</html>
