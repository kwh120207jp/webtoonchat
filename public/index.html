<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Log Viewer</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)" rel="stylesheet">
    <style>
        @import url('[https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap](https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap)');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f0f0;
        }

        /* KakaoTalk Specific Colors */
        .bg-kakao-bg { background-color: #b2c7da; }
        .bg-kakao-yellow { background-color: #fee500; }
        .text-kakao-brown { color: #3b1e1e; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-anim {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">

    <!-- App Container -->
    <div class="flex-1 flex flex-col h-full max-w-md mx-auto bg-white shadow-2xl relative">
        
        <!-- Header -->
        <header class="bg-white/90 backdrop-blur-sm p-4 flex items-center justify-between border-b z-10 sticky top-0">
            <div class="flex items-center gap-3">
                <h1 class="font-bold text-lg text-gray-800">채팅 백업 뷰어</h1>
                <span id="messageCount" class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">0 messages</span>
            </div>
            <div class="flex gap-2">
                 <button onclick="document.getElementById('fileInput').click()" class="text-gray-600 hover:text-black p-2 rounded-full hover:bg-gray-100 transition" title="파일 업로드">
                    <i class="fas fa-folder-open"></i>
                </button>
                <button onclick="openSettings()" class="text-gray-600 hover:text-black p-2 rounded-full hover:bg-gray-100 transition" title="설정">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
            <input type="file" id="fileInput" accept=".json" class="hidden" onchange="handleFileUpload(event)">
        </header>

        <!-- Chat Area -->
        <main id="chatContainer" class="flex-1 bg-kakao-bg overflow-y-auto p-4 flex flex-col gap-2">
            
            <!-- Empty State / Welcome -->
            <div id="emptyState" class="flex flex-col items-center justify-center h-full text-center p-6 text-gray-500 space-y-4">
                <div class="w-16 h-16 bg-yellow-400 rounded-3xl flex items-center justify-center text-white text-3xl shadow-lg mb-2">
                    <i class="fas fa-comment"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-700">채팅 파일을 열어주세요</h2>
                <p class="text-sm opacity-70">JSON 형식의 백업 파일을 업로드하면<br>대화 내용이 이곳에 나타납니다.</p>
                <div class="flex gap-2 mt-4">
                    <button onclick="document.getElementById('fileInput').click()" class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-black transition text-sm">
                        파일 업로드
                    </button>
                    <button onclick="loadDemoData()" class="px-6 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition text-sm">
                        예시 보기
                    </button>
                </div>
            </div>

            <!-- Messages will be injected here -->
            <div id="messageList" class="flex flex-col gap-1 pb-4"></div>

        </main>

        <!-- Input Area (Visual Only) -->
        <footer class="bg-white p-3 border-t flex items-center gap-2">
            <button class="text-gray-400 p-2"><i class="fas fa-plus"></i></button>
            <div class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm text-gray-400 cursor-not-allowed">
                대화 내용은 수정할 수 없습니다
            </div>
            <button class="bg-yellow-400 text-kakao-brown p-2 rounded-full w-9 h-9 flex items-center justify-center shadow-sm">
                <i class="fas fa-arrow-up"></i>
            </button>
        </footer>

    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h3 class="font-bold">설정</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">내 이름 (오른쪽 배치)</label>
                    <input type="text" id="userNameInput" placeholder="예: User, 팀장" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <p class="text-xs text-gray-400 mt-1">이 이름이나 'role: user'인 메시지는 오른쪽에 표시됩니다.</p>
                </div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end">
                <button onclick="saveSettings()" class="px-4 py-2 bg-yellow-400 text-kakao-brown font-bold rounded-lg text-sm hover:bg-yellow-500">저장</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentMessages = [];
        let myName = localStorage.getItem('chatViewer_myName') || "";

        // Elements
        const chatContainer = document.getElementById('chatContainer');
        const messageList = document.getElementById('messageList');
        const emptyState = document.getElementById('emptyState');
        const messageCountSpan = document.getElementById('messageCount');
        const settingsModal = document.getElementById('settingsModal');
        const userNameInput = document.getElementById('userNameInput');

        // Init
        userNameInput.value = myName;

        // --- Logic ---

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    processData(json);
                } catch (error) {
                    alert("JSON 파일을 읽는 중 오류가 발생했습니다. 올바른 형식인지 확인해주세요.");
                    console.error(error);
                }
            };
            reader.readAsText(file);
        }

                { "content": "[밀리안나]: 제피르씨, 이런 식으로 장난치면 안 돼요.", "role": "assistant" },
                { "content": "라그네아 부팀장님이 힘들어하시잖아요.", "role": "assistant" },
                { "content": "[세리온]: ...제피르.", "role": "assistant" },
                { "content": "서류 반납.", "role": "assistant" },

                { "content": "[제피르]: 아~ 재미없어.", "role": "assistant" },
                { "content": "[라그네아]: 팀장, 어젯밤 순찰 결과야.", "role": "assistant" },
                { "content": "별 문제 없었어.\n
